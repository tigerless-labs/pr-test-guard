[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-harness"
version = "0.1.0"
description = "Evaluate whether agentic PRs have enough test evidence to support their change claims."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Tigerless Labs" }
]
dependencies = [
  "coverage",
  "pytest"
]

[project.optional-dependencies]
llm = [
  "openai"
]

[project.scripts]
claim-harness = "claim_harness.cli:main"

[tool.setuptools.packages.find]
include = ["claim_harness*"]
