name: Benchmark Cases

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-cases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Validate case structure
        run: python scripts/validate_cases.py

      - name: Run executable cases
        run: python scripts/validate_cases.py --run

      - name: Generate runner artifacts
        run: python scripts/run_case.py --output-dir /tmp/claim-harness-artifacts
