name: Benchmark Cases

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-cases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -e .

      - name: Validate case structure
        run: python scripts/validate_cases.py

      - name: Run executable cases
        run: python scripts/validate_cases.py --run

      - name: Generate runner artifacts
        run: python scripts/run_case.py --output-dir /tmp/claim-harness-artifacts

      - name: Validate real PR bundles
        run: python scripts/validate_real_pr_bundles.py

      - name: Check module entrypoint
        run: python -m claim_harness --version

      - name: Validate cases through module entrypoint
        run: python -m claim_harness validate-cases

      - name: Generate artifacts through module entrypoint
        run: python -m claim_harness run-cases --case weak_assertion_001 --output-dir /tmp/claim-harness-module-artifacts

      - name: Validate real PR bundles through module entrypoint
        run: python -m claim_harness validate-real-pr-bundles
