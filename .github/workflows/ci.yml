name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  regression-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run direct-check unit tests
        run: python -m pytest -q tests

      - name: Validate regression fixtures
        run: python scripts/validate_cases.py

      - name: Run executable regression fixtures
        run: python scripts/validate_cases.py --run

      - name: Generate rule-analysis artifacts
        run: python scripts/run_case.py --output-dir /tmp/pr-test-guard-artifacts

      - name: Validate real PR input bundles
        run: python scripts/validate_real_pr_bundles.py

      - name: Check module entrypoint
        run: python -m pr_test_guard --version

      - name: Smoke-test direct PR check
        run: python -m pr_test_guard check --base HEAD~1 --format json > /tmp/pr-test-guard-direct.json

      - name: Smoke-test reusable Action
        id: guard
        uses: ./
        with:
          base: HEAD~1

      - name: Validate reusable Action outputs
        shell: bash
        env:
          STATUS: ${{ steps.guard.outputs.status }}
          FINDINGS_COUNT: ${{ steps.guard.outputs.findings-count }}
          WARNING_COUNT: ${{ steps.guard.outputs.warning-count }}
          ERROR_COUNT: ${{ steps.guard.outputs.error-count }}
          REPORT_PATH: ${{ steps.guard.outputs.report-path }}
        run: |
          set -euo pipefail
          [[ "$STATUS" =~ ^(clean|advisory|failed)$ ]]
          [[ "$FINDINGS_COUNT" =~ ^[0-9]+$ ]]
          [[ "$WARNING_COUNT" =~ ^[0-9]+$ ]]
          [[ "$ERROR_COUNT" =~ ^[0-9]+$ ]]
          [[ "$REPORT_PATH" == "pr-test-guard-report.json" ]]
